<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caltrans GNSS Study — Static Occupation Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
/* ======================================================================
   SETTINGS — the only part you should ever need to edit
   ====================================================================== */
</style>
<script>
const CONFIG = {
  repo:   "scpetersonGNSS/Caltrans-GNSS-Study", // GitHub owner/repo
  branch: "main",                               // branch the files live on
  folder: "data/raw",                           // where you upload .asc files
  extensions: [".asc", ".csv", ".txt"],         // file types the site will show
  gapFactor: 3   // a pause longer than 3x the normal epoch spacing is drawn as a break
};
// Site codes recognised at the start of a file name (e.g. SJER_GREC.asc)
const SITES = {
  SJER:    "Site 1: San Joaquin Experimental Range",
  RANGE:   "Site 1: San Joaquin Experimental Range",
  FRESNO:  "Site 2: Fresno State",
  FS:      "Site 2: Fresno State",
  FSU:     "Site 2: Fresno State",
  ELKHORN: "Site 3: Elkhorn",
  ELK:     "Site 3: Elkhorn"
};
const TESTS = { G: "Test 1 (GPS)", GREC: "Test 2 (GPS+GLO+GAL+BDS)", GEC: "Test 3 (GPS+GAL+BDS)",
                GRE: "Test 4 (GPS+GLO+GAL)", GRC: "Test 5 (GPS+GLO+BDS)" };
</script>
<style>
:root{
  --paper:#F7F9FA; --panel:#FFFFFF; --ink:#18262F; --muted:#5B6B75; --rule:#D5DDE2;
  --blue:#1F5F8B; --gold:#C98A00; --north:#1F5F8B; --east:#2E8B57; --elev:#A23B3B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
header{padding:28px clamp(16px,4vw,48px) 20px;border-bottom:3px solid var(--ink);background:var(--panel)}
header h1{margin:0;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 110px)}
aside{border-right:1px solid var(--rule);background:var(--panel);padding:20px 16px;overflow-y:auto}
aside h2{font-size:.95rem;margin:18px 0 6px;color:var(--muted);font-weight:600}
aside h2:first-child{margin-top:0}
.file{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:8px 10px;margin:2px 0;cursor:pointer;font:inherit;color:var(--ink);border-radius:0 4px 4px 0}
.file:hover{background:#EEF3F6}
.file:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.file.active{border-left-color:var(--gold);background:#FFF7E3}
.file .name{font-weight:600;font-size:.95rem;word-break:break-all}
.file .meta{font-size:.82rem;color:var(--muted)}
.drop{margin-top:24px;border:2px dashed var(--rule);border-radius:6px;padding:14px;font-size:.88rem;color:var(--muted)}
.drop.over{border-color:var(--blue);background:#EEF3F6}
.drop label{color:var(--blue);text-decoration:underline;cursor:pointer}
main{padding:24px clamp(16px,3vw,40px) 48px;min-width:0}
.title h2{margin:0;font-size:1.5rem}
.title p{margin:2px 0 0;color:var(--muted)}
.title a{color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin:18px 0 22px}
.stat{background:var(--panel);padding:10px 14px}
.stat .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--muted)}
.plot{background:var(--panel);border:1px solid var(--rule);margin-bottom:22px}
.msg{color:var(--muted);padding:40px 0}
.err{color:#A23B3B}
@media (max-width:820px){ .wrap{grid-template-columns:1fr} aside{border-right:0;border-bottom:1px solid var(--rule);max-height:45vh} }
</style>
</head>
<body>
<header>
  <h1>Caltrans GNSS Study</h1>
  <p>Static occupation data exported from Trimble Business Center. Pick a dataset to see how the measured position wandered over the occupation.</p>
</header>
<div class="wrap">
  <aside>
    <div id="list"><p class="msg">Loading datasets…</p></div>
    <div class="drop" id="drop">
      Check a file before uploading: drag a .asc here or <label for="local">choose one</label>.
      It stays on your computer.
      <input type="file" id="local" accept=".asc,.csv,.txt" hidden>
    </div>
  </aside>
  <main id="main"><p class="msg">Select a dataset on the left.</p></main>
</div>

<script>
/* ======================================================================
   PARSING — reads TBC .asc exports directly (no conversion needed)
   ====================================================================== */
function parseTime(s){
  s = (s||"").trim();
  let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}(?:\.\d+)?))?\s*([AP]M)?/i);
  let Y,Mo,D,h,mi,se;
  if(m){ Mo=+m[1]; D=+m[2]; Y=+m[3]; h=+m[4]; mi=+m[5]; se=+(m[6]||0);
    if(m[7]){ const pm=m[7].toUpperCase()==="PM"; if(h===12) h=pm?12:0; else if(pm) h+=12; } }
  else { m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}(?:\.\d+)?))?/);
    if(!m) return null; Y=+m[1]; Mo=+m[2]; D=+m[3]; h=+m[4]; mi=+m[5]; se=+(m[6]||0); }
  const ms = Date.UTC(Y,Mo-1,D,h,mi,Math.floor(se),Math.round((se%1)*1000));
  const p = n=>String(n).padStart(2,"0");
  return { ms, str:`${Y}-${p(Mo)}-${p(D)} ${p(h)}:${p(mi)}:${p(Math.floor(se))}` };
}

function splitRow(line, delim){
  if(delim===",") return line.split(",").map(s=>s.trim().replace(/^"|"$/g,""));
  if(delim==="\t") return line.split("\t").map(s=>s.trim());
  // whitespace-delimited: first 4 fields, the rest is the timestamp
  const parts = line.trim().split(/\s+/);
  return [...parts.slice(0,4), parts.slice(4).join(" ")];
}

function parseASC(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) throw new Error("The file is empty.");
  const delim = lines[0].includes(",") ? "," : lines[0].includes("\t") ? "\t" : " ";
  let first = splitRow(lines[0], delim);
  const hasHeader = first.slice(1,4).some(v=>isNaN(parseFloat(v)));
  let idx = {id:0, n:1, e:2, z:3, t:4};
  if(hasHeader){
    const find = re => first.findIndex(h=>re.test(h));
    const f = { id:find(/point|name|^id$/i), n:find(/north|^n$|^y$/i), e:find(/east|^e$|^x$/i),
                z:find(/elev|height|ortho|^z$|^h$/i), t:find(/time|date/i) };
    for(const k in f) if(f[k]>=0) idx[k]=f[k];
  }
  const rows=[];
  for(let i = hasHeader?1:0; i<lines.length; i++){
    const c = splitRow(lines[i], delim);
    const n=parseFloat(c[idx.n]), e=parseFloat(c[idx.e]), z=parseFloat(c[idx.z]);
    const t = parseTime(c[idx.t]);
    if(isFinite(n)&&isFinite(e)&&isFinite(z)&&t) rows.push({id:c[idx.id], n, e, z, ms:t.ms, ts:t.str});
  }
  if(rows.length<2) throw new Error("Couldn't find Northing / Easting / Elevation / time columns in this file.");
  rows.sort((a,b)=>a.ms-b.ms);
  return rows;
}

/* ======================================================================
   STATISTICS
   ====================================================================== */
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
const std  = (a,m) => Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));
function analyze(rows){
  const N=rows.map(r=>r.n), E=rows.map(r=>r.e), Z=rows.map(r=>r.z);
  const mN=mean(N), mE=mean(E), mZ=mean(Z);
  const sN=std(N,mN), sE=std(E,mE), sZ=std(Z,mZ);
  const dts=[]; for(let i=1;i<rows.length;i++) dts.push(rows[i].ms-rows[i-1].ms);
  const sorted=[...dts].sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)]||5000;
  const gapIdx=new Set(); dts.forEach((d,i)=>{ if(d>CONFIG.gapFactor*med) gapIdx.add(i+1); });
  return { mN,mE,mZ,sN,sE,sZ, drms:Math.sqrt(sN*sN+sE*sE), med, gapIdx,
           start:rows[0], end:rows[rows.length-1], dur:rows[rows.length-1].ms-rows[0].ms };
}

/* ======================================================================
   FILE LISTING — asks GitHub what's in data/raw, so new uploads appear automatically
   ====================================================================== */
function describeName(name){
  const base = name.replace(/\.[^.]+$/,"");
  const tokens = base.toUpperCase().split(/[_\-\s.]+/);
  let site = null, test = null;
  for(const t of tokens){ if(!site && SITES[t]) site=SITES[t]; if(!test && TESTS[t]) test=TESTS[t]; }
  if(!test && /GPS[_\-\s]*ONLY/i.test(base)) test=TESTS.G;
  return { site, test };
}

async function listFiles(){
  const ok = n => CONFIG.extensions.some(x=>n.toLowerCase().endsWith(x));
  try{
    const r = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    return j.filter(f=>f.type==="file" && ok(f.name))
            .map(f=>({ name:f.name, url:f.download_url, size:f.size }));
  }catch(err){
    // Fallback (e.g. GitHub's hourly API limit hit): an optional hand-kept list
    const r = await fetch(`${CONFIG.folder}/manifest.json`).catch(()=>null);
    if(r && r.ok){ const names = await r.json();
      return names.filter(ok).map(n=>({ name:n, url:`${CONFIG.folder}/${encodeURIComponent(n)}` })); }
    throw new Error("Couldn't reach GitHub to list the data folder. Try reloading in a minute.");
  }
}

// Read just the first few lines of each file to learn its date
async function peekDate(file){
  try{
    const r = await fetch(file.url, { headers:{ Range:"bytes=0-1023" } });
    const txt = (await r.text()).split(/\r?\n/).slice(0,4).join("\n");
    for(const line of txt.split("\n")){ const t=parseTime(line.split(",").slice(-1)[0]) || parseTime(line); if(t) return t; }
  }catch(e){}
  return null;
}

/* ======================================================================
   UI
   ====================================================================== */
const $ = id => document.getElementById(id);
let FILES = [], cache = {};

function renderList(){
  const groups = {};
  for(const f of FILES){ const g = f.site || "Other uploads"; (groups[g] ||= []).push(f); }
  const order = Object.keys(groups).sort((a,b)=> (a==="Other uploads") - (b==="Other uploads") || a.localeCompare(b));
  $("list").innerHTML = order.map(g=>{
    const items = groups[g].sort((a,b)=>(b.date?.ms||0)-(a.date?.ms||0));
    return `<h2>${g}</h2>` + items.map(f=>`<button class="file" data-name="${encodeURIComponent(f.name)}">
      <div class="name">${f.name}</div>
      <div class="meta">${[f.date?f.date.str.slice(0,10):"", f.test||""].filter(Boolean).join(", ")}</div></button>`).join("");
  }).join("") || `<p class="msg">No files in ${CONFIG.folder} yet.</p>`;
  document.querySelectorAll(".file").forEach(b=>b.onclick=()=>openFile(decodeURIComponent(b.dataset.name)));
  markActive();
}
function markActive(){
  const cur = decodeURIComponent(location.hash.replace(/^#/,""));
  document.querySelectorAll(".file").forEach(b=>b.classList.toggle("active", decodeURIComponent(b.dataset.name)===cur));
}

async function openFile(name){
  const f = FILES.find(x=>x.name===name); if(!f) return;
  history.replaceState(null,"","#"+encodeURIComponent(name)); markActive();
  $("main").innerHTML = `<p class="msg">Loading ${name}…</p>`;
  try{
    if(!cache[name]){ const r = await fetch(f.url); if(!r.ok) throw new Error(`Download failed (${r.status})`);
      cache[name] = parseASC(await r.text()); }
    show(name, cache[name], f.url, f);
  }catch(e){ $("main").innerHTML = `<p class="msg err">${name}: ${e.message}</p>`; }
}

const fmtDur = ms => { const h=Math.floor(ms/3.6e6), m=Math.round((ms%3.6e6)/6e4); return `${h} h ${m} min`; };

function show(name, rows, url, info){
  const s = analyze(rows), d = info || describeName(name);
  const sub = [d.site, d.test].filter(Boolean).join(", ");
  $("main").innerHTML = `
    <div class="title"><h2>${name}</h2>
      <p>${sub ? sub+". " : ""}${s.start.ts} to ${s.end.ts}${url?` &nbsp;<a href="${url}" download>Download raw file</a>`:" (local preview, not uploaded)"}</p></div>
    <div class="stats">
      <div class="stat"><div class="v">${rows.length.toLocaleString()}</div><div class="k">Epochs (every ${(s.med/1000).toFixed(0)} s)</div></div>
      <div class="stat"><div class="v">${fmtDur(s.dur)}</div><div class="k">Occupation length${s.gapIdx.size?`, ${s.gapIdx.size} gap${s.gapIdx.size>1?"s":""}`:""}</div></div>
      <div class="stat"><div class="v">${s.mN.toFixed(3)}</div><div class="k">Mean Northing (m)</div></div>
      <div class="stat"><div class="v">${s.mE.toFixed(3)}</div><div class="k">Mean Easting (m)</div></div>
      <div class="stat"><div class="v">${s.mZ.toFixed(3)}</div><div class="k">Mean Elevation (m)</div></div>
      <div class="stat"><div class="v">${(s.sN*1000).toFixed(1)} / ${(s.sE*1000).toFixed(1)}</div><div class="k">1σ North / East (mm)</div></div>
      <div class="stat"><div class="v">${(s.drms*1000).toFixed(1)}</div><div class="k">Horizontal DRMS (mm)</div></div>
      <div class="stat"><div class="v">${(s.sZ*1000).toFixed(1)}</div><div class="k">1σ Elevation (mm)</div></div>
    </div>
    <div class="plot" id="ts"></div>
    <div class="plot" id="hz"></div>`;
  plotTimeSeries(rows, s); plotHorizontal(rows, s);
}

function plotTimeSeries(rows, s){
  const comps = [["n","Northing",s.mN,s.sN,"--north"],["e","Easting",s.mE,s.sE,"--east"],["z","Elevation",s.mZ,s.sZ,"--elev"]];
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const traces=[], shapes=[], layout={ height:640, margin:{l:70,r:20,t:40,b:40}, showlegend:false,
    title:{text:"Deviation from mean (mm)",font:{size:15}}, font:{family:"Public Sans, sans-serif"},
    plot_bgcolor:"#fff", paper_bgcolor:"#fff", hovermode:"x unified" };
  comps.forEach(([k,label,m,sd,col],i)=>{
    const x=[], y=[];
    rows.forEach((r,j)=>{ if(s.gapIdx.has(j)){ x.push(null); y.push(null); } x.push(r.ts); y.push(+((r[k]-m)*1000).toFixed(1)); });
    const ax = i?String(i+1):"";
    traces.push({ x, y, type:"scattergl", mode:"lines", name:label, line:{width:1,color:css(col)},
      xaxis:"x"+ax, yaxis:"y"+ax, connectgaps:false, hovertemplate:`${label}: %{y:.1f} mm<extra></extra>` });
    const top = 1 - i/3, dom=[top-1/3+0.06, top-0.02];
    layout["yaxis"+ax] = { domain:dom, title:{text:label,font:{size:12}}, zeroline:true, zerolinecolor:"#9AA8B0", gridcolor:"#EEF1F3", ticksuffix:" " };
    layout["xaxis"+ax] = { anchor:"y"+ax, matches: i? "x":undefined, showticklabels:i===2, gridcolor:"#EEF1F3", type:"date" };
    [1,2].forEach(n=>[1,-1].forEach(sg=>shapes.push({ type:"line", xref:`x${ax} domain`, yref:"y"+ax,
      x0:0, x1:1, y0:sg*n*sd*1000, y1:sg*n*sd*1000, line:{width:1,dash:n===1?"dash":"dot",color:n===1?"#5B6B75":"#A9B5BC"} })));
  });
  layout.shapes = shapes;
  Plotly.newPlot("ts", traces, layout, {responsive:true, displaylogo:false});
}

function plotHorizontal(rows, s){
  const dE = rows.map(r=>+((r.e-s.mE)*1000).toFixed(1)), dN = rows.map(r=>+((r.n-s.mN)*1000).toFixed(1));
  const hrs = rows.map(r=>(r.ms-rows[0].ms)/3.6e6);
  const r1 = s.drms*1000, r2 = 2*r1, lim = dE.reduce((m,v,i)=>Math.max(m,Math.abs(v),Math.abs(dN[i])), r2*1.25)*1.05;
  const circ = (r,dash,label)=>({ type:"circle", x0:-r, x1:r, y0:-r, y1:r, line:{color:"#18262F",width:1.2,dash},
    label:{text:label,textposition:"top center",font:{size:11}} });
  Plotly.newPlot("hz", [{ x:dE, y:dN, type:"scattergl", mode:"markers",
      marker:{ size:4, color:hrs, colorscale:"Viridis", opacity:.7,
               colorbar:{ title:{text:"Hours from start",side:"right"}, thickness:12 } },
      text: rows.map(r=>r.ts), hovertemplate:"%{text}<br>E %{x:.1f} mm, N %{y:.1f} mm<extra></extra>" }],
    { height:560, margin:{l:70,r:20,t:40,b:60}, font:{family:"Public Sans, sans-serif"},
      title:{text:"Horizontal scatter about the mean position",font:{size:15}},
      xaxis:{ title:"Easting offset (mm)", range:[-lim,lim], zeroline:true, gridcolor:"#EEF1F3" },
      yaxis:{ title:"Northing offset (mm)", range:[-lim,lim], scaleanchor:"x", zeroline:true, gridcolor:"#EEF1F3" },
      shapes:[circ(r1,"dash",`DRMS ${r1.toFixed(1)} mm`), circ(r2,"dot",`2DRMS ${r2.toFixed(1)} mm`)] },
    {responsive:true, displaylogo:false});
}

/* Local preview (drag & drop) */
function previewLocal(file){
  const rd = new FileReader();
  rd.onload = () => { try{ show(file.name, parseASC(rd.result), null, null); }
                      catch(e){ $("main").innerHTML = `<p class="msg err">${file.name}: ${e.message}</p>`; } };
  rd.readAsText(file);
}
$("local").onchange = e => e.target.files[0] && previewLocal(e.target.files[0]);
const drop=$("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>e.dataTransfer.files[0] && previewLocal(e.dataTransfer.files[0]));

/* Start */
(async()=>{
  try{
    FILES = (await listFiles()).map(f=>({...f, ...describeName(f.name)}));
    renderList();
    await Promise.all(FILES.map(async f=>{ f.date = await peekDate(f); }));
    renderList();
    const want = decodeURIComponent(location.hash.replace(/^#/,""));
    const start = FILES.find(f=>f.name===want) ||
                  [...FILES].sort((a,b)=>(b.date?.ms||0)-(a.date?.ms||0))[0];
    if(start) openFile(start.name);
  }catch(e){ $("list").innerHTML = `<p class="msg err">${e.message}</p>`; }
})();
</script>
</body>
</html>
