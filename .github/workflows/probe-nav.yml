name: Test satellite geometry (temporary)
on:
  push:
    branches: [claude/sat-geometry-probe]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute geometry
        run: |
          { time python scripts/satellite_geometry.py ; } > run.log 2>&1 || true
          python scripts/dev/validate_geometry.py >> run.log 2>&1 || true
          cat run.log
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data run.log validation.txt || true
          git commit -m "Test results" && git push || true
