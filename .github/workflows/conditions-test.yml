# Temporary: checks the satellite / ionosphere computation on GitHub's
# machines. Runs only on the conditions-test branch.
name: Conditions test
on:
  push:
    branches: [conditions-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Which data servers answer
        run: |
          probe() {
            code=$(curl -sL -o /tmp/l.html -w '%{http_code} %{time_total}s' -m 30 "$1")
            names=$(grep -oE 'href="[^"?]+' /tmp/l.html 2>/dev/null | sed 's/href="//' | grep -vE '^(\.\.|/|https?:|#)' | grep -- "${2:-.}" | grep -v ULT | sort -u | head -60 | tr '\n' ' ')
            echo "== $1 -> $code" >> servers.txt
            echo "$names" >> servers.txt
          }
          for u in http://navigation-office.esa.int/products/gnss-products/2437/ESA0OPSRAP_20262690000_01D_05M_ORB.SP3.gz http://navigation-office.esa.int/products/gnss-products/2437/ESA0OPSFIN_20262690000_01D_05M_ORB.SP3.gz; do
            curl -s -m 60 "$u" | gunzip | awk '/^\*/{exit} {print}' | grep -E '^(#|\+ )' | head -12 >> servers.txt; echo "-- $u" >> servers.txt
          done
          probe http://navigation-office.esa.int/products/gnss-products/2437/mgex/ .
          probe http://navigation-office.esa.int/products/gnss-products/ mgex
          curl -s -m 60 https://igs.bkg.bund.de/root_ftp/IGS/BRDC/2026/269/BRDC00IGS_R_20262690000_01D_MN.rnx.gz | gunzip | head -3 >> servers.txt
          curl -s -m 60 https://igs.bkg.bund.de/root_ftp/IGS/BRDC/2026/269/BRDC00IGS_R_20262690000_01D_MN.rnx.gz | gunzip | grep -c '^> EPH\|^[GREC][0-9][0-9] ' >> servers.txt
          probe http://chapman.upc.es/tomion/rapid/2026/ 28
          cat servers.txt
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $(ls test-report.md test-log.txt servers.txt 2>/dev/null)
          git commit -m "Conditions test results" && (git pull --rebase -q origin conditions-test || true) && git push
