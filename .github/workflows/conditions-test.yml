# Temporary: checks the satellite / ionosphere computation on GitHub's
# machines. Runs only on the conditions-test branch.
name: Conditions test
on:
  push:
    branches: [conditions-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Which data servers answer
        run: |
          probe() { echo "== $1 -> $(curl -sL -o /tmp/l.html -w '%{http_code} %{time_total}s' -m 30 "$1")" | tee -a servers.txt; grep -oE 'href="[^"?]+' /tmp/l.html 2>/dev/null | sed 's/href="//' | grep -vE '^(\.\.|/|https?:)' | head -40 | tr '\n' ' ' | tee -a servers.txt; echo | tee -a servers.txt; }
          probe https://igs.bkg.bund.de/root_ftp/
          probe https://igs.bkg.bund.de/root_ftp/IGS/products/
          probe https://igs.bkg.bund.de/root_ftp/MGEX/products/2437/
          probe https://igs.bkg.bund.de/root_ftp/IGS/products/2437/
          probe https://gssc.esa.int/gnss/products/
          probe https://gssc.esa.int/gnss/products/2437/
          probe https://gssc.esa.int/gnss/products/2437/mgex/
          probe https://gssc.esa.int/gnss/products/ionex/2026/269/
          probe https://igs.ign.fr/pub/igs/products/
          probe https://igs.ign.fr/pub/igs/products/mgex/2437/
          probe https://igs.ign.fr/pub/igs/products/ionosphere/2026/269/
      - name: Compute and check
        timeout-minutes: 15
        run: |
          python scripts/compute_conditions.py --report test-report.md --only 20260926-082350,20260926-080720,20260926-082140,20260926-080719 2>&1 | tee test-log.txt || true
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-report.md test-log.txt servers.txt || git add -f servers.txt test-log.txt
          git commit -m "Conditions test results" && (git pull --rebase -q origin conditions-test || true) && git push
