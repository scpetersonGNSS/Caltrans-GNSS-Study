# Temporary: checks the satellite / ionosphere computation on GitHub's
# machines. Runs only on the conditions-test branch.
name: Conditions test
on:
  push:
    branches: [conditions-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Compute and check
        timeout-minutes: 20
        run: |
          python scripts/compute_conditions.py --report test-report.md --only 20260926-082350,20260926-080720,20260926-082140,20260926-080719,20260926-082125 2>&1 | tee test-log.txt
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $(ls test-report.md test-log.txt servers.txt 2>/dev/null)
          git commit -m "Conditions test results" && (git pull --rebase -q origin conditions-test || true) && git push
